<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View the details of your Coffi orders saved in this browser."
    />
    <meta name="author" content="Zhaksylyk Adilet" />
    <title>My Orders - Coffi Coffee Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/bootstrap-custom.css" />
  </head>
  <body id="top" class="account-page">
    <header class="site-header">
      <nav
        class="navbar navbar-expand-lg border-bottom py-3"
        aria-label="Primary navigation"
      >
        <div class="container-fluid px-3 px-lg-5">
          <a class="navbar-brand brand-wordmark fw-bold fs-3" href="index.html">Coffi</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#siteNav"
            aria-controls="siteNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="siteNav">
            <ul class="navbar-nav mx-auto gap-lg-3 mb-3 mb-lg-0 mt-3 mt-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
              <li class="nav-item"><a class="nav-link" href="booking.html">Reservations</a></li>
              <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
              <li class="nav-item">
                <a class="nav-link" href="account.html">Account</a>
              </li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="orders.html">My orders</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="site-main container py-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <h1 class="display-6 mb-0">My orders</h1>
        <a class="btn btn-primary rounded-pill" href="menu.html">Browse menu</a>
      </div>
      <p class="text-body-secondary">Orders saved on this browser. Contact Coffi to confirm your order.</p>
      <p id="orders-status" class="state-message is-hidden p-3 rounded-3" role="status"></p>
      <p id="orders-empty" class="state-message p-3 rounded-3">No saved orders yet. Choose drinks from the menu to get started.</p>
      <div id="orders-list" class="d-grid gap-3"></div>
    </main>

    <a
      class="back-top btn btn-dark btn-sm rounded-pill position-fixed bottom-0 end-0 m-3 shadow-sm"
      href="#top"
    >
      Back to top ↑
    </a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/orders.js" defer></script>
  </body>
</html>
